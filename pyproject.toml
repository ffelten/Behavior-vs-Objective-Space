[build-system]
requires = ["setuptools >= 74.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morl_behavior_objective"
dynamic = ["version"]
description="Studying the differences between behavior space and objective space in MORL."
readme = "README.md"
requires-python = ">= 3.10"
keywords = ["Reinforcement Learning", "Multi-Objective Reinforcement Learning"]
dependencies = [
    "numpy",
    "mo-gymnasium[mujoco,highway] >= 1.2.0",
    "morl-baselines >= 1.2.0",
    "scipy >= 1.16.1",
    "matplotlib >= 3.9.3",
    "seaborn >= 0.13.2",
    "scikit-learn >= 1.3.1",
    "zadu >= 0.3.0",
    "reptrix ",
    "lidar ",
    "ipympl",
]

[project.optional-dependencies]
all = [
]

testing = ["pytest >= 8.3.2"]

[tool.setuptools]
packages = ["morl_behavior_objective"]

######################## Linters and Test tools #########################

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "templates",
    "venv",
    "docs",
    "*.ipynb",
]

# Same as Black.
line-length = 124
indent-width = 4
target-version = "py310"


######################################## LINTING ########################################
[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",      # flake8-annotations (mypy's job)
  "COM812",   # missing-trailing-comma (conflicts with formatter)
  "CPY",      # flake8-copyright
  "D105",     # undocumented-magic-method
  "D107",     # undocumented-public-init
  "D401",     # non-imperative-mood
  "E501",     # line-too-long (formatter's job)
  "EM101",    # raw-string-in-exception
  "EM102",    # f-string-in-exception
  "E741",     # ambiguous-variable-name
  "FIX002",   # flake8-fixme (flake8-todos is enough)
  "PTH",      # flake8-use-pathlib
  "S101",     # flake8-bandit: assert
  "S301",     # suspicious-pickle-usage
  "S603",     # subprocess-without-shell-equals-true
  "S607",     # start-process-with-partial-path
  "T201",     # print
  "TRY003",     # print
  # --- Research/ML conventions: silence rules that fight scientific code ---
  "ARG001",   # unused-function-argument (callback/interface signatures)
  "ARG002",   # unused-method-argument (nn.Module/gym API overrides)
  "C901",     # complex-structure (research functions are inherently branchy)
  "ERA001",   # commented-out-code (exploratory alternatives in scripts/notebooks)
  "FBT001",   # boolean-typed positional arg in function definition
  "FBT002",   # boolean default positional arg
  "FBT003",   # boolean positional value in call
  "N802",     # invalid-function-name (math notation)
  "N803",     # invalid-argument-name (math notation: B, L, T)
  "N806",     # non-lowercase-variable-in-function (math notation: D_mean)
  "N812",     # lowercase-imported-as-non-lowercase (torch.nn.functional as F)
  "NPY002",   # legacy np.random (global-seeded for experiment reproducibility)
  "PLC0415",  # import-outside-top-level (lazy imports for optional/heavy deps)
  "PLR0911",  # too-many-return-statements
  "PLR0912",  # too-many-branches
  "PLR0913",  # too-many-arguments
  "PLR0915",  # too-many-statements
  "PLR2004",  # magic-value-comparison (thresholds in plots/checks)
  "PLW2901",  # redefined-loop-name
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Google format for docstring
[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.isort]
# Settings for google standard.
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = [
    "typing",
    "collections.abc",
    "typing_extensions",
]
order-by-type = false



######################################## PER FILE IGNORES ########################################
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B018",    # B018 - Found useless expression - necessary for testing exceptions are raised.
    "D100",    # D100 - Module dostrings not required in test files.
    "D104",    # D104 - Package dostrings not required in test files.
    "ARG",     # ARG - Unused args are common in tests with mock patches and mock functions.
    "D",       # Pydocstyle
]
"*/__init__.py" = [
    "F401",    # Module imported but unused
    "D104",    # D104 - Package dostrings not required in init files.
    "E402"
]
"docs/**" = [
    "D",       # Pydocstyle
]
"setup.py" = [
    "D",       # Pydocstyle
    "ANN",      # annotations
    "SIM",      # simplify
    "TRY",      # tryceratops

]
"**/templates/**/*.py" = ["ALL"]
"**/deep_sea_treasure/**/*.py" = ["ALL"]
# Exploratory analysis scripts: relax docs/structure rules.
"**/analysis/**/*.py" = [
    "D",       # Pydocstyle - exploratory analysis scripts.
    "INP001",  # implicit-namespace-package
    "E402",    # module-import-not-at-top-of-file
]
"**/methods/*.py" = [
    "D",       # Pydocstyle - research model code; docstrings tracked separately.
]


###################################### FORMAT ########################################
[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"